services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: app_mobile_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Express}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: app_mobile_backend
    depends_on:
      - db
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      SECRET_KEY: "${SECRET_KEY}"
      EMAIL_USER: "${EMAIL_USER:-}"
      EMAIL_PASS: "${EMAIL_PASS:-}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-EmoGarden}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
      BEEKNOEE_API_KEY: "${BEEKNOEE_API_KEY:-}"
      BEEKNOEE_BASE_URL: "${BEEKNOEE_BASE_URL:-https://platform.beeknoee.com/api/v1}"
      MODEL: "${MODEL:-gemini-2.5-flash}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  mssql-data:
